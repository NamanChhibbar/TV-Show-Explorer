server {
  listen 8080;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Without an explicit Cache-Control, browsers fall back to heuristic
  # caching and can serve a stale page for hours after a redeploy.
  # "no-cache" still caches, but forces a revalidation against the ETag
  # first, so a new deploy is always picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
