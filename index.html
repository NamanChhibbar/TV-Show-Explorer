<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search and explore TV shows using the TVMaze API.">
  <title>TV Show Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- ============ SHARED CHROME (on both views) ============ -->
  <header class="site-header">
    <h1 class="site-title">
      <span>&#x1F3AC;</span>
      <span>TV Show Explorer</span>
    </h1>
    <p class="tagline">Discover shows from every network, powered by <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener noreferrer">TVMaze</a></p>
  </header>

  <hr class="header-rule">

  <main>
    <!-- Back button sits to the LEFT of the search bar; shown only on the detail view -->
    <section class="search-section" aria-label="Search shows">
      <div class="search-bar">
        <form id="search-form" class="search-form" role="search" novalidate>
          <input
            type="search"
            id="search-input"
            name="q"
            class="search-input"
            placeholder="Search for a show, e.g. Breaking Bad, Girls, The Office"
            autocomplete="off"
            required>
          <button type="submit" id="search-button" class="search-button">Search</button>
        </form>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </section>

    <!-- ============ HOME VIEW (search results) ============ -->
    <div id="home-view" class="view">
      <!-- Status messages: loading / error / empty -->
      <section class="status-section" aria-live="polite">
        <div id="loading" class="status loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading shows&hellip;</span>
        </div>
        <div id="error" class="status error" role="alert" hidden></div>
        <div id="empty" class="status empty" hidden>No shows matched your search.</div>
      </section>
      <!-- Results: container stays hidden until a search returns shows -->
      <section id="results-container" class="results-section" aria-label="Search results" hidden>
        <p id="results-count" class="results-count"></p>
        <ul id="results-list" class="results-list"></ul>
      </section>
    </div>

    <!-- ============ DETAIL VIEW (one show, replaces the home view) ============ -->
    <div id="detail-view" class="view" hidden>
      <div align="start">
        <button type="button" id="back-button" class="back-button">
          <span aria-hidden="true">&larr;</span> Back
        </button>
      </div>
      <div id="detail-loading" class="status loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading show&hellip;</span>
      </div>
      <div id="detail-error" class="status error" role="alert" hidden></div>
      <!-- Populated by js/app.js -->
      <article id="detail-body" class="detail-body"></article>
    </div>
  </main>

  <!-- Template for a single result card -->
  <template id="show-card-template">
    <li class="show-card">
      <img class="show-poster" src="" alt="" loading="lazy">
      <div class="show-info">
        <h3 class="show-name"></h3>
        <p class="show-rating">
          <span class="star" aria-hidden="true">&#x2605;</span>
          <span class="rating-value"></span>
        </p>
        <!-- Genre bubbles, one <li> per genre (see #genre-template) -->
        <ul class="show-genres"></ul>
        <div class="show-footer">
          <p class="show-meta">
            <span class="show-network"></span>
            <span class="meta-dot" aria-hidden="true">&middot;</span>
            <span class="show-date"></span>
          </p>
          <span class="show-status"></span>
        </div>
      </div>
    </li>
  </template>

  <!-- Template for one genre bubble inside .show-genres -->
  <template id="genre-template">
    <li class="genre"></li>
  </template>

  <!-- Template for the whole detail view body -->
  <template id="detail-template">
    <div class="detail-layout">

      <!-- Left: expanded poster -->
      <div class="detail-poster-col">
        <img class="detail-poster" src="" alt="" loading="lazy">
      </div>

      <!-- Centre: everything else -->
      <div class="detail-main">
        <h2 class="detail-name"></h2>

        <!-- Rating + genres, same treatment as the show card -->
        <div class="detail-headline">
          <p class="show-rating">
            <span class="star" aria-hidden="true">&#x2605;</span>
            <span class="rating-value"></span>
          </p>
          <ul class="show-genres"></ul>
        </div>

        <!-- Facts table -->
        <ul class="detail-facts">
          <li>
            <span class="fact-label">Network</span>
            <span class="fact-value detail-network"></span>
          </li>
          <li>
            <span class="fact-label">Premiered</span>
            <span class="fact-value detail-premiered"></span>
          </li>
          <li>
            <span class="fact-label">Ended</span>
            <span class="fact-value detail-ended"></span>
          </li>
          <li>
            <span class="fact-label">Status</span>
            <span class="fact-value detail-status"></span>
          </li>
          <li>
            <span class="fact-label">Runtime</span>
            <span class="fact-value detail-runtime"></span>
          </li>
          <li>
            <span class="fact-label">Schedule</span>
            <span class="fact-value detail-schedule"></span>
          </li>
        </ul>

        <!-- Official site -->
        <a class="site-button" href="#" target="_blank" rel="noopener noreferrer">
          Visit official site
          <span aria-hidden="true">&#x2197;</span>
        </a>

        <!-- Summary -->
        <section class="detail-section">
          <h3 class="section-heading">Summary</h3>
          <div class="detail-summary"></div>
        </section>

        <!-- Cast: horizontally scrollable strip -->
        <section class="detail-section">
          <h3 class="section-heading">Cast</h3>
          <ul class="cast-list"></ul>
        </section>

        <!-- Season / episode counts -->
        <section class="detail-stats" aria-label="Season and episode counts">
          <div class="stat">
            <span class="stat-value stat-seasons"></span>
            <span class="stat-label">Seasons</span>
          </div>
          <div class="stat">
            <span class="stat-value stat-episodes"></span>
            <span class="stat-label">Episodes</span>
          </div>
        </section>
      </div>

    </div>
  </template>

  <!-- Template for one actor in the cast strip -->
  <template id="cast-template">
    <li class="cast-member">
      <img class="cast-photo" src="" alt="" loading="lazy">
      <span class="cast-name"></span>
      <span class="cast-character"></span>
    </li>
  </template>

  <script src="js/app.js" defer></script>
</body>
</html>
